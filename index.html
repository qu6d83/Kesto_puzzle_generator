<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Kesto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
            overscroll-behavior: none; 
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }

        #top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            background-color: #2ecc71;
            color: white;
            flex-shrink: 0;
        }

        button:hover:not(:disabled) { background-color: #27ae60; }
        button:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
            transform: none;
        }
        button:active:not(:disabled) { transform: scale(0.96); }

        #restart-btn { background-color: #e74c3c; }
        #restart-btn:hover:not(:disabled) { background-color: #c0392b; }

        select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            outline: none;
            background-color: white;
            cursor: pointer;
        }

        #info-text {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            background-color: #bdc3c7;
            border: 4px solid #7f8c8d;
            border-radius: 4px;
            padding: 2px;
            width: 100%;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            touch-action: none;
        }

        .cell {
            background-color: #fff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            user-select: none;
        }

        .obstacle { background-color: #444444 !important; }
        .moving-block { background-color: #e67e22 !important; transition: background-color 0.1s; }
        .target { border: min(1.5vw, 4px) solid #2980b9 !important; }
        .moving-block.target { background-color: #f1c40f !important; }

        .disclaimer-text {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 15px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar">
            <select id="diff-select">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="impossible">Impossible</option>
            </select>
            <button id="gen-btn" onclick="generateLevel()">Gen</button>
            <button id="restart-btn" onclick="restartLevel()" disabled>Reset</button>
        </div>

        <div id="info-text">-</div>
        <div id="board"></div>

        <div class="disclaimer-text">
            Swipe or use Arrow Keys to move.<br>
            Unofficial game based on "Kesto" by Hiking studio.
        </div>
    </div>

    <script>
        const n = 8;
        
        let initialState = 0n;
        let currentState = 0n;
        let targetState = 0n;
        let obsState = 0n;
        
        let currentSteps = 0;
        let isPlaying = false;

        const L_WALL = 0x0101010101010101n;
        const R_WALL = 0x8080808080808080n;
        const B_WALL = 0x00000000000000FFn;
        const T_WALL = 0xFF00000000000000n;

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = "";
            for (let y = n; y >= 1; y--) {
                for (let x = 1; x <= n; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    board.appendChild(cell);
                }
            }
        }

        function renderBoard() {
            for (let y = 1; y <= n; y++) {
                for (let x = 1; x <= n; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    cell.className = 'cell'; 
                    const bitIndex = BigInt((y - 1) * 8 + (x - 1));
                    const mask = 1n << bitIndex;
                    
                    if ((targetState & mask) !== 0n) cell.classList.add('target');
                    if ((obsState & mask) !== 0n) cell.classList.add('obstacle');
                    if ((currentState & mask) !== 0n) cell.classList.add('moving-block');
                }
            }
        }

        function getNextBitboard(S, dir, obs) {
            let blocked, prev, can;
            if (dir === 'l') {
                blocked = (S & L_WALL) | (S & (obs << 1n));
                do { prev = blocked; blocked |= S & (blocked << 1n); } while(blocked !== prev);
                can = S & ~blocked; return blocked | (can >> 1n);
            } else if (dir === 'r') {
                blocked = (S & R_WALL) | (S & (obs >> 1n));
                do { prev = blocked; blocked |= S & (blocked >> 1n); } while(blocked !== prev);
                can = S & ~blocked; return blocked | (can << 1n);
            } else if (dir === 'd') {
                blocked = (S & B_WALL) | (S & (obs << 8n));
                do { prev = blocked; blocked |= S & (blocked << 8n); } while(blocked !== prev);
                can = S & ~blocked; return blocked | (can >> 8n);
            } else if (dir === 'u') {
                blocked = (S & T_WALL) | (S & (obs >> 8n));
                do { prev = blocked; blocked |= S & (blocked >> 8n); } while(blocked !== prev);
                can = S & ~blocked; return blocked | (can << 8n);
            }
            return S;
        }

        function movePlayer(dir) {
            if (!isPlaying) return;
            const nextState = getNextBitboard(currentState, dir, obsState);
            
            if (nextState !== currentState) {
                currentState = nextState;
                currentSteps++;
                renderBoard();
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            const infoText = document.getElementById('info-text');
            if (currentState === targetState) {
                isPlaying = false;
                infoText.innerText = `Cleared: ${currentSteps}`;
                infoText.style.color = "#27ae60";
            } else {
                infoText.innerText = currentSteps;
            }
        }

        function restartLevel() {
            if (initialState === 0n) return;
            currentState = initialState;
            currentSteps = 0;
            isPlaying = true;
            document.getElementById('info-text').style.color = "#2c3e50";
            document.getElementById('info-text').innerText = currentSteps;
            renderBoard();
        }

        function runSolverHidden(startS, targetS, obsS) {
            if (startS === targetS) return 0;
            const queue = [{ s: startS, p: 0 }];
            const visited = new Set([startS]);
            let head = 0;
            const dirs = ['u', 'd', 'l', 'r'];

            while (head < queue.length) {
                const curr = queue[head++];
                if (curr.p > 30) return -1; 
                for (let i = 0; i < 4; i++) {
                    const nState = getNextBitboard(curr.s, dirs[i], obsS);
                    if (!visited.has(nState)) {
                        const nPathLen = curr.p + 1;
                        if (nState === targetS) return nPathLen;
                        visited.add(nState);
                        queue.push({ s: nState, p: nPathLen });
                    }
                }
            }
            return -1;
        }

        async function generateLevel() {
            const diffSelect = document.getElementById('diff-select').value;
            const genBtn = document.getElementById('gen-btn');
            const restartBtn = document.getElementById('restart-btn');
            const infoText = document.getElementById('info-text');

            isPlaying = false;
            genBtn.disabled = true;
            restartBtn.disabled = true;
            infoText.style.color = "#2c3e50";
            infoText.style.fontSize = "20px";
            infoText.innerText = "Generating...";
            
            await new Promise(r => setTimeout(r, 50));

            let attempts = 0;
            let maxAttempts = 800;
            let found = false;

            while (attempts < maxAttempts) {
                attempts++;
                let m = Math.floor(Math.random() * 2) + 2; 
                let k = Math.floor(Math.random() * 8) + 8; 
                if (diffSelect === 'hard' || diffSelect === 'impossible') {
                    m = Math.floor(Math.random() * 2) + 3; 
                    k = Math.floor(Math.random() * 12) + 12; 
                }

                let positions = Array.from({length: 64}, (_, i) => i);
                for (let i = positions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }

                let tStart = 0n, tTarget = 0n, tObs = 0n;
                let idx = 0;
                for (let i = 0; i < m; i++) tStart |= 1n << BigInt(positions[idx++]);
                for (let i = 0; i < m; i++) tTarget |= 1n << BigInt(positions[idx++]);
                for (let i = 0; i < k; i++) tObs |= 1n << BigInt(positions[idx++]);

                let pathLen = runSolverHidden(tStart, tTarget, tObs);
                if (pathLen <= 0) continue; 

                let match = false;
                if (diffSelect === 'easy' && pathLen > 0 && pathLen < 10) match = true;
                else if (diffSelect === 'medium' && pathLen >= 10 && pathLen < 15) match = true;
                else if (diffSelect === 'hard' && pathLen >= 15 && pathLen < 20) match = true;
                else if (diffSelect === 'impossible' && pathLen >= 20) match = true;

                if (match) {
                    initialState = tStart;
                    targetState = tTarget;
                    obsState = tObs;
                    found = true;
                    break;
                }
            }

            infoText.style.fontSize = "36px";
            if (found) {
                restartLevel(); 
                restartBtn.disabled = false;
            } else {
                infoText.innerText = "Timeout!";
            }
            genBtn.disabled = false;
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            let moved = false;
            if (['ArrowUp', 'w', 'W'].includes(e.key)) { movePlayer('u'); moved = true; }
            if (['ArrowDown', 's', 'S'].includes(e.key)) { movePlayer('d'); moved = true; }
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) { movePlayer('l'); moved = true; }
            if (['ArrowRight', 'd', 'D'].includes(e.key)) { movePlayer('r'); moved = true; }
            if (moved) e.preventDefault(); 
        }, {passive: false});

        const boardElem = document.getElementById('board');
        let touchStartX = 0;
        let touchStartY = 0;

        boardElem.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        boardElem.addEventListener('touchend', e => {
            if (!isPlaying) return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) movePlayer(dx > 0 ? 'r' : 'l');
            } else {
                if (Math.abs(dy) > 30) movePlayer(dy > 0 ? 'd' : 'u');
            }
        }, {passive: true});

        window.onload = initBoard;
    </script>
</body>
</html>
